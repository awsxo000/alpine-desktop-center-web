name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Bridge tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Validate Python and shell syntax
        run: |
          python3 -m py_compile server/local_server.py tests/test_local_server.py
          sh -n "Alpine Desktop Center" install-desktop.sh launch-from-desktop.sh scripts/package-portable.sh

      - name: Validate desktop entry
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils
          export HOME="$RUNNER_TEMP/test-home"
          export XDG_DATA_HOME="$HOME/.local/share"
          mkdir -p "$HOME"
          sh install-desktop.sh
          desktop-file-validate "$XDG_DATA_HOME/applications/alpine-desktop-center.desktop"

      - name: Package and verify pinned release artifact
        env:
          BACKEND_COMMIT: 9efb8a8320958a1b9b79becf65b049814599af56
          BUILD_ROOT: ${{ runner.temp }}/portable-build
          BACKEND_SOURCE: ${{ runner.temp }}/alpine-backend
        run: |
          git clone --quiet --depth 1 --branch v1.43 https://github.com/awsxo000/alpine.git "$BACKEND_SOURCE"
          test "$(git -C "$BACKEND_SOURCE" rev-parse HEAD)" = "$BACKEND_COMMIT"
          BACKEND_COMMIT_EXPECTED="$BACKEND_COMMIT" ./scripts/package-portable.sh
          package_version=$(node -p "require('./package.json').version")
          package="Alpine-Desktop-Center-Web-v$package_version"
          archive="$BUILD_ROOT/$package.tar.gz"
          extracted="$RUNNER_TEMP/extracted-release"
          mkdir -p "$extracted"
          tar -xzf "$archive" -C "$extracted"
          release="$extracted/$package"
          grep -Fx "backend=v1.43" "$release/RELEASE-VERSIONS"
          grep -Fx "backend_commit=$BACKEND_COMMIT" "$release/RELEASE-VERSIONS"
          (cd "$release/backend" && sha256sum -c "$release/BACKEND-MANIFEST.sha256")
          PYTHONPATH="$release/server" python3 - "$release" <<'PY'
          import sys
          from pathlib import Path
          import local_server
          valid, message = local_server.validate_backend(Path(sys.argv[1]))
          print(message)
          raise SystemExit(0 if valid else 1)
          PY
          if BACKEND_SOURCE="$BACKEND_SOURCE" BACKEND_COMMIT_EXPECTED=0000000000000000000000000000000000000000 BUILD_ROOT="$BUILD_ROOT/rejected-override" ./scripts/package-portable.sh; then
            echo "The v1.43 backend pin accepted an unexpected SHA override." >&2
            exit 1
          fi
