name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6, node24
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, node24
        with:
          node-version: "22"
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, node24
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Bridge tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Validate Python and shell syntax
        run: |
          python3 -m py_compile server/local_server.py tests/test_local_server.py
          sh -n "Alpine Desktop Center" install-desktop.sh launch-from-desktop.sh scripts/package-portable.sh

      - name: Validate desktop entry
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils
          export HOME="$RUNNER_TEMP/test-home"
          export XDG_DATA_HOME="$HOME/.local/share"
          mkdir -p "$HOME"
          sh install-desktop.sh
          desktop-file-validate "$XDG_DATA_HOME/applications/alpine-desktop-center.desktop"

      - name: Package and verify pinned release artifact
        env:
          BACKEND_COMMIT: 881558709d94539acc81bd06ef556ba3562dc07d
          BACKEND_VERSION: v1.44-dev
          BUILD_ROOT: ${{ runner.temp }}/portable-build
          BACKEND_SOURCE: ${{ runner.temp }}/alpine-backend
        run: |
          git clone --quiet --depth 1 --branch fix/one-shot-doas-authorization https://github.com/awsxo000/alpine.git "$BACKEND_SOURCE"
          test "$(git -C "$BACKEND_SOURCE" rev-parse HEAD)" = "$BACKEND_COMMIT"
          package_version=$(node -p "require('./package.json').version")
          package="Alpine-Desktop-Center-Web-v$package_version"
          archive="$BUILD_ROOT/$package.tar.gz"
          BACKEND_COMMIT_EXPECTED="$BACKEND_COMMIT" ./scripts/package-portable.sh "$package_version" "$BACKEND_VERSION"
          first_hash=$(sha256sum "$archive" | cut -d ' ' -f1)
          BACKEND_COMMIT_EXPECTED="$BACKEND_COMMIT" ./scripts/package-portable.sh "$package_version" "$BACKEND_VERSION"
          second_hash=$(sha256sum "$archive" | cut -d ' ' -f1)
          test "$first_hash" = "$second_hash"
          extracted="$RUNNER_TEMP/extracted-release"
          mkdir -p "$extracted"
          tar -xzf "$archive" -C "$extracted"
          release="$extracted/$package"
          grep -Fx "backend=$BACKEND_VERSION" "$release/RELEASE-VERSIONS"
          grep -Fx "backend_commit=$BACKEND_COMMIT" "$release/RELEASE-VERSIONS"
          test -s "$release/LICENSE"
          if find "$release" -type d -name __pycache__ -print -quit | grep -q .; then
            echo "Unexpected Python bytecode cache in portable release." >&2
            exit 1
          fi
          (cd "$release/backend" && sha256sum -c "$release/BACKEND-MANIFEST.sha256")
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$release/server" python3 -B - "$release" <<'PY'
          import sys
          from pathlib import Path
          import local_server
          valid, message = local_server.validate_backend(Path(sys.argv[1]))
          print(message)
          raise SystemExit(0 if valid else 1)
          PY
          if BACKEND_SOURCE="$BACKEND_SOURCE" BACKEND_COMMIT_EXPECTED=0000000000000000000000000000000000000000 BUILD_ROOT="$BUILD_ROOT/rejected-override" ./scripts/package-portable.sh "$package_version" "$BACKEND_VERSION"; then
            echo "The v1.44-dev backend pin accepted an unexpected SHA override." >&2
            exit 1
          fi
